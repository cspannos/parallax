[package]
name = "commitments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Domain-separated commitments (hash of state, not a validity proof)"

[dependencies]
blake3.workspace = true
sha2.workspace = true
protocol-types.workspace = true

# ARMv8 SHA-256 instructions natively (Apple silicon). Not for zkVM guests,
# which patch `sha2` to the prover-accelerated fork.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
