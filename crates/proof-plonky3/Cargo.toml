[package]
name = "proof-plonky3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Plonky3 AIR of tiny F, match-step, walk, mixed-I, 8k-book scan, Poseidon2-16 path, BLAKE3 compression, node_digest, 8k upsert path, engine Place C' openings, 8-event C' tape, and 8 HeightStatement C' openings. Not F of the height, not a zkVM."

[dependencies]
tiny-f.workspace = true
protocol-types.workspace = true
commitments.workspace = true
blake3.workspace = true
thiserror.workspace = true
p3-air = "0.6.3"
p3-baby-bear = "0.6.3"
p3-challenger = "0.6.3"
p3-commit = "0.6.3"
p3-dft = "0.6.3"
p3-field = "0.6.3"
p3-fri = "0.6.3"
p3-matrix = "0.6.3"
p3-merkle-tree = "0.6.3"
p3-poseidon2 = "0.6.3"
p3-symmetric = "0.6.3"
p3-uni-stark = "0.6.3"
rand = { version = "0.10", features = ["std_rng"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
clob.workspace = true
