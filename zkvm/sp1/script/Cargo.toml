[package]
version = "0.1.0"
name = "tiny-f-script"
edition = "2021"
default-run = "tiny-f-sp1"

[[bin]]
name = "tiny-f-sp1"
path = "src/bin/main.rs"

[[bin]]
name = "f"
path = "src/bin/f.rs"

[dependencies]
clob = { path = "../../../crates/clob" }
commitments = { path = "../../../crates/commitments" }
bincode = "1.3"
sp1-sdk = { version = "6.8.1", features = ["blocking"] }
tiny-f-guest-logic = { path = "../../spec" }
# sp1-prover 6.8.1 calls TempDir::keep() -> PathBuf (tempfile 3.21).
tempfile = "=3.21.0"

[build-dependencies]
sp1-build = { version = "6.8.1" }
