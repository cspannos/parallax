[package]
name = "inc_tape_guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "^3.0.6", default-features = false, features = ["std"] }
commitments = { path = "../../../../crates/commitments" }

# Accelerated SHA-256 (RISC Zero precompile) for the Q-PRF-7 SHA-256 `C'` mode.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
